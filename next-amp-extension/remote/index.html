<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>NextAmp Remote</title>
    <link href="./styles.css" rel="stylesheet" />
    <script src="../assets/js/tailwindcss.js"></script>
    <script src="../assets/js/peerjs.min.js"></script>
  </head>
  <body>
    <div class="remote-container">
      <div class="theme-bar">
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 bg-[#00ff00] border border-white"></div>
          <span class="tracking-widest text-lg">NEXTAMP REMOTE</span>
        </div>
        <div class="flex items-center gap-3">
          <div
            id="status-indicator"
            class="w-3 h-3 rounded-full bg-red-600 border border-white/50 shadow-[0_0_5px_red]"
          ></div>
          <button
            id="btn-video-toggle"
            class="win-btn bg-[#e0f0ff] text-blue-900 min-w-[80px] text-xs h-8"
          >
            VIDEO ON
          </button>
        </div>
      </div>

      <div
        class="flex-1 overflow-y-auto p-2 space-y-2 bg-[#222] scrollbar-hide pb-32"
      >
        <div class="win-border-in">
          <div
            class="flex justify-between items-center border-b border-[#333] pb-1"
          >
            <span class="text-label text-gray-300">AUDIO CONTROL</span>
          </div>

          <div class="grid-2" id="audio-grid"></div>
        </div>

        <div class="win-border-in flex flex-col">
          <div
            class="flex justify-between items-center border-b border-[#333] pb-1"
          >
            <span class="text-label text-green-500 text-base">EQUALIZER</span>

            <div class="flex items-center gap-2">
              <select
                id="remote-eq-preset"
                class="bg-black text-gray-300 border border-gray-600 outline-none h-6 px-1 font-pixel text-[10px] focus:border-green-500 w-24 rounded-none"
              >
                <option value="flat">FLAT</option>
                <option value="bass">BASS</option>
                <option value="rock">ROCK</option>
                <option value="pop">POP</option>
                <option value="voice">VOICE</option>
                <option value="custom">USER</option>
              </select>
              <button
                id="btn-eq-toggle"
                class="win-btn bg-[#e0ffe0] text-green-900 w-12 h-6 text-xs"
              >
                ON
              </button>
            </div>
          </div>

          <div id="remote-eq-container"></div>
        </div>

        <div class="win-border-in">
          <div
            class="flex justify-between items-center border-b border-[#333] pb-1"
          >
            <span class="text-label text-blue-400 text-base">VIDEO</span>
            <select
              id="remote-video-quality"
              class="bg-black text-[#00ff00] text-[10px] border border-gray-600 outline-none h-6 px-1 font-pixel w-20"
            >
              <option value="max">MAX</option>
              <option value="high">1080P</option>
              <option value="mid">720P</option>
              <option value="low">360P</option>
            </select>
          </div>

          <div id="video-full-width-container"></div>

          <div class="grid-2" id="video-grid"></div>

          <div class="grid-2" id="video-pos-grid"></div>
        </div>
      </div>
    </div>

    <div
      id="conn-overlay"
      class="fixed inset-0 bg-black/95 z-[9999] flex items-center justify-center p-6"
    >
      <div
        class="win-border-in w-full max-w-[300px] flex flex-col items-center p-8 gap-8 border-4 border-[#444]"
      >
        <div
          class="text-[#00ff00] font-bold text-2xl tracking-widest animate-pulse"
        >
          CONNECTING
        </div>
        <div
          class="w-16 h-16 border-8 border-t-[#00ff00] border-r-[#00ff00] border-b-transparent border-l-transparent rounded-full animate-spin"
        ></div>
        <p id="conn-msg" class="text-sm text-gray-500 font-pixel">
          Initializing...
        </p>
      </div>
    </div>

    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(console.error);
      }
    </script>
  </body>
</html>
